setupVersion: 2
modelRoles: 
  smol: cx/gpt-5.6-luna:max
  tiny: cx/gpt-5.3-codex-spark
  designer: kimi-k3-256k:max
  task: "@default:medium"
  plan: "@default"
  commit: "@smol"
  vision: omniroute/combo/vision
  advisor: "@slow"
  reviewer: "@slow"
  slow: cx/gpt-5.6-sol:xhigh
  default: cx/gpt-5.6-sol:high
compaction: 
  idleEnabled: true
  methodOrder: 
    - remote
    - soft
task: 
  showResolvedModelBadge: true
  isolation: 
    mode: auto
  eager: preferred
commands: 
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
tools: 
  outputMaxColumns: 0
disabledProviders: 
  - claude
  - codex
  - opencode
  - ollama
secrets: 
  enabled: true
collab: 
  relayUrl: ""
share: 
  serverUrl: ""
symbolPreset: nerd
statusLine: 
  preset: custom
  leftSegments: 
    - model
    - mode
    - context_pct
    - git
    - token_rate
  rightSegments: 
    - session_name
  segmentOptions: 
    model: 
      showThinkingLevel: true
    git: 
      showBranch: true
      showStaged: false
      showUnstaged: false
      showUntracked: false
  compactThinkingLevel: true
dev: 
  autoqa: false
  autoqaPush: 
    endpoint: ""
hideThinkingBlock: true
irc: 
  timeoutMs: 300000
steeringMode: all
interruptMode: wait
error: 
  notify: "on"
github: 
  enabled: true
textVerbosity: low
tui: 
  scrollbackRebuild: true
  resizeScrollback: rebuild
todo: 
  reminders: false
composer: 
  shape: claude
providers: 
  openaiWebsockets: "off"