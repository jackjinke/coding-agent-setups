setupVersion: 2
modelRoles:
  designer: anthropic/claude-opus-5-5:xhigh
  writer: google/gemini-4-argon:medium
  plan: anthropic/claude-opus-5-5:xhigh
  commit: "@smol"
  vision: openai/gpt-6-luna:xhigh
  advisor: openai/gpt-6-astra:high
  slow: openai/gpt-6-astra:xhigh
  default: google/gemini-4-argon:high
  task: openai/gpt-6.1-sol:high
  smol: deepseek/deepseek-flash:high
  tiny: local/lfm2.5-230m
  web: web/exa
task:
  isolation:
    enabled: true
commands:
  enableClaudeProject: false
  enableOpencodeProject: false
tools:
  outputMaxColumns: 0
disabledProviders:
  - claude
  - codex
  - opencode
  - ollama
secrets:
  enabled: true
collab:
  relayUrl: ""
share:
  serverUrl: ""
symbolPreset: nerd
statusLine:
  preset: custom
  leftSegments:
    - model
    - mode
    - context_pct
    - git
    - token_rate
  rightSegments:
    - session_name
  segmentOptions:
    git:
      showStaged: false
      showUnstaged: false
      showUntracked: false
dev:
  autoqa: false
  autoqaPush:
    endpoint: ""
hideThinkingBlock: true
steeringMode: all
interruptMode: wait
error:
  notify: "on"
github:
  enabled: true
textVerbosity: low
composer:
  shape: claude
tui:
  titleState: false
generate_image:
  enabled: true
todo:
  reminders: false
terminal:
  showProgress: true
  showImages: true
doubleEscapeAction: tree
recap:
  enabled: false
providers:
  tinyModelDevice: auto
  openaiLiveSteering: false
retry:
  waitForUsageReset: true
compaction:
  methodOrder:
    - remote
    - soft
    - handoff
    - snapcompact
  modelThresholds:
    anthropic/claude-opus-5-5: 500000
    anthropic/claude-sonnet-5-5: 50%
    openai/gpt-6-astra: 500000
    openai/gpt-6-luna: 500000
    antigravity/gemini-4-argon: 500000
    google/gemini-4-argon: 500000
    deepseek/deepseek-flash: 500000
    openai/gpt-6.1-sol: 500000
  idleEnabled: true
defaultThinkingLevel: auto
modelPresets:
  claude:
    modelRoles:
      designer: anthropic/claude-opus-5-5:auto
      writer: antigravity/gemini-4-argon:high
      plan: "@slow"
      commit: "@smol"
      vision: anthropic/claude-haiku-5-5:high
      advisor: "@slow"
      reviewer: "@slow"
      slow: anthropic/claude-opus-5-5:xhigh
      default: anthropic/claude-opus-5-5
      task: anthropic/claude-sonnet-5-5:auto
      smol: anthropic/claude-sonnet-5-5:medium
      tiny: local/lfm2.5-230m
    defaultThinkingLevel: auto
  gpt:
    modelRoles:
      designer: openai/gpt-6-astra:auto
      writer: antigravity/gemini-4-argon:high
      plan: "@slow"
      commit: "@smol"
      vision: openai/gpt-6-luna:max
      advisor: "@slow"
      reviewer: "@slow"
      slow: openai/gpt-6-astra:xhigh
      default: openai/gpt-6-astra
      task: openai/gpt-6.1-sol:auto
      smol: openai/gpt-6-luna:xhigh
      tiny: local/lfm2.5-230m
    defaultThinkingLevel: auto
  combo:
    modelRoles:
      designer: anthropic/claude-opus-5-5:xhigh
      writer: google/gemini-4-argon:medium
      plan: anthropic/claude-opus-5-5:xhigh
      commit: "@smol"
      vision: openai/gpt-6-luna:xhigh
      advisor: openai/gpt-6-astra:high
      slow: openai/gpt-6-astra:xhigh
      default: google/gemini-4-argon:high
      task: openai/gpt-6.1-sol:high
      smol: deepseek/deepseek-flash:high
      tiny: local/lfm2.5-230m
      web: web/exa
    defaultThinkingLevel: auto
theme:
  dark: dark-abyss
  light: light-one
display:
  cacheMissMarker: true