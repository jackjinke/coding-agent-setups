setupVersion: 2
modelRoles:
  tiny: cliproxyapi/gpt-5.3-codex-spark
  designer: cliproxyapi/gpt-6-astra:medium
  plan: "@slow"
  commit: "@smol"
  vision: cliproxyapi/gpt-5.6-luna:max
  advisor: "@slow"
  reviewer: "@slow"
  slow: cliproxyapi/gpt-6-astra:high
  default: cliproxyapi/gpt-6-astra:medium
  task: cliproxyapi/gpt-6-astra:low
  smol: cliproxyapi/gpt-5.6-luna:xhigh
compaction:
  idleEnabled: true
  methodOrder:
    - remote
    - soft
    - snapcompact
task:
  showResolvedModelBadge: true
  isolation:
    enabled: true
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
tools:
  outputMaxColumns: 0
disabledProviders:
  - claude
  - codex
  - opencode
  - ollama
secrets:
  enabled: true
collab:
  relayUrl: ""
share:
  serverUrl: ""
symbolPreset: nerd
statusLine:
  preset: custom
  leftSegments:
    - model
    - mode
    - context_pct
    - git
    - token_rate
  rightSegments:
    - session_name
  segmentOptions:
    model:
      showThinkingLevel: true
    git:
      showBranch: true
      showStaged: false
      showUnstaged: false
      showUntracked: false
  compactThinkingLevel: true
dev:
  autoqa: false
  autoqaPush:
    endpoint: ""
hideThinkingBlock: true
irc:
  timeoutMs: 300000
steeringMode: all
interruptMode: wait
error:
  notify: "on"
github:
  enabled: true
textVerbosity: low
composer:
  shape: claude
tui:
  titleState: false
generate_image:
  enabled: true
isolation:
  backend: auto
todo:
  reminders: false
