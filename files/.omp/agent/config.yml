setupVersion: 2
modelRoles:
  designer: anthropic/claude-opus-5-5:medium
  plan: "@slow"
  commit: "@smol"
  vision: openai-codex/gpt-6-luna:max
  advisor: "@slow"
  reviewer: "@slow"
  slow: openai-codex/gpt-6-astra:xhigh
  default: anthropic/claude-opus-5-5:high
  task: anthropic/claude-opus-5-5:medium
  smol: openai-codex/gpt-6-luna:xhigh
  tiny: local/lfm2.5-230m
compaction:
  methodOrder:
    - remote
    - soft
    - snapcompact
task:
  isolation:
    enabled: true
commands:
  enableClaudeProject: false
  enableOpencodeProject: false
tools:
  outputMaxColumns: 0
disabledProviders:
  - claude
  - codex
  - opencode
  - ollama
secrets:
  enabled: true
collab:
  relayUrl: ""
share:
  serverUrl: ""
symbolPreset: nerd
statusLine:
  preset: custom
  leftSegments:
    - model
    - mode
    - context_pct
    - git
    - token_rate
  rightSegments:
    - session_name
  segmentOptions:
    git:
      showStaged: false
      showUnstaged: false
      showUntracked: false
dev:
  autoqa: false
  autoqaPush:
    endpoint: ""
hideThinkingBlock: true
steeringMode: all
interruptMode: wait
error:
  notify: "on"
github:
  enabled: true
textVerbosity: low
composer:
  shape: claude
tui:
  titleState: false
generate_image:
  enabled: true
todo:
  reminders: false
terminal:
  showProgress: true
doubleEscapeAction: tree
recap:
  enabled: false
providers:
  tinyModelDevice: auto