setupVersion: 2
modelRoles:
  designer: anthropic/claude-opus-5-5:high
  plan: anthropic/claude-opus-5-5:xhigh
  commit: openai-codex/gpt-6-luna:xhigh
  vision: openai-codex/gpt-6-luna:xhigh
  advisor: openai-codex/gpt-6-astra:high
  reviewer: "@slow"
  slow: openai-codex/gpt-6-astra:xhigh
  default: antigravity/gemini-4-argon:high
  task: openai-codex/gpt-6.1-sol:high
  smol: openai-codex/gpt-6-luna:xhigh
  tiny: local/lfm2.5-230m
task:
  isolation:
    enabled: true
  enableEffort: false
commands:
  enableClaudeProject: false
  enableOpencodeProject: false
tools:
  outputMaxColumns: 0
disabledProviders:
  - claude
  - codex
  - opencode
  - ollama
secrets:
  enabled: true
collab:
  relayUrl: ""
share:
  serverUrl: ""
symbolPreset: nerd
statusLine:
  preset: custom
  leftSegments:
    - model
    - mode
    - context_pct
    - git
    - token_rate
  rightSegments:
    - session_name
  segmentOptions:
    git:
      showStaged: false
      showUnstaged: false
      showUntracked: false
dev:
  autoqa: false
  autoqaPush:
    endpoint: ""
hideThinkingBlock: true
steeringMode: all
interruptMode: wait
error:
  notify: "on"
github:
  enabled: true
textVerbosity: low
composer:
  shape: claude
  tokenRate: false
tui:
  titleState: false
generate_image:
  enabled: true
todo:
  reminders: false
terminal:
  showProgress: true
doubleEscapeAction: tree
recap:
  enabled: false
providers:
  tinyModelDevice: auto
  openai-codex:
    codeMode: auto
retry:
  waitForUsageReset: true
compaction:
  methodOrder:
    - remote
    - soft
    - handoff
    - snapcompact
  modelThresholds:
    anthropic/claude-opus-5-5: 500000
    anthropic/claude-sonnet-5-5: 50%
    openai-codex/gpt-6-astra: 400000
    openai-codex/gpt-6-luna: 400000
    antigravity/gemini-4-argon: 500000
  idleEnabled: true
defaultThinkingLevel: auto
modelPresets:
  claude:
    modelRoles:
      designer: anthropic/claude-opus-5-5:auto
      plan: "@slow"
      commit: "@smol"
      vision: anthropic/claude-haiku-5-5:high
      advisor: "@slow"
      reviewer: "@slow"
      slow: anthropic/claude-opus-5-5:xhigh
      default: anthropic/claude-opus-5-5
      task: anthropic/claude-sonnet-5-5:auto
      smol: anthropic/claude-sonnet-5-5:medium
      tiny: local/lfm2.5-230m
    defaultThinkingLevel: auto
  gpt:
    modelRoles:
      designer: openai-codex/gpt-6-astra:auto
      plan: "@slow"
      commit: "@smol"
      vision: openai-codex/gpt-6-luna:max
      advisor: "@slow"
      reviewer: "@slow"
      slow: openai-codex/gpt-6-astra:xhigh
      default: openai-codex/gpt-6-astra
      task: openai-codex/gpt-6.1-sol:auto
      smol: openai-codex/gpt-6-luna:xhigh
      tiny: local/lfm2.5-230m
    defaultThinkingLevel: auto
  combo:
    modelRoles:
      designer: anthropic/claude-opus-5-5:high
      plan: anthropic/claude-opus-5-5:xhigh
      commit: openai-codex/gpt-6-luna:xhigh
      vision: openai-codex/gpt-6-luna:xhigh
      advisor: openai-codex/gpt-6-astra:high
      reviewer: "@slow"
      slow: openai-codex/gpt-6-astra:xhigh
      default: antigravity/gemini-4-argon:high
      task: openai-codex/gpt-6.1-sol:high
      smol: openai-codex/gpt-6-luna:xhigh
      tiny: local/lfm2.5-230m
    defaultThinkingLevel: auto
extendedContext: false
theme:
  dark: titanium
  light: light-one
prewalk:
  enabled: true
  autoTarget: "@task"
display:
  cacheMissMarker: true
colorBlindMode: false
advisor:
  enabled: true