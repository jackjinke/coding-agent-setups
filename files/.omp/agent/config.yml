setupVersion: 2
modelRoles:
  smol: gpt-5.6-luna:max
  tiny: cx/gpt-5.3-codex-spark
  designer: kimi-k3-256k:max
  task: "@default:medium"
  plan: "@default"
  commit: "@smol"
  vision: omniroute/combo/vision
  advisor: "@slow"
  reviewer: "@slow"
  slow: gpt-6-astra:high
  default: gpt-6-astra:med
compaction:
  idleEnabled: true
  methodOrder:
    - soft
    - snapcompact
    - remote
task:
  showResolvedModelBadge: true
  isolation:
    enabled: true
  eager: preferred
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
tools:
  outputMaxColumns: 0
disabledProviders:
  - claude
  - codex
  - opencode
  - ollama
secrets:
  enabled: true
collab:
  relayUrl: ""
share:
  serverUrl: ""
symbolPreset: nerd
statusLine:
  preset: custom
  leftSegments:
    - model
    - mode
    - context_pct
    - git
    - token_rate
  rightSegments:
    - session_name
  segmentOptions:
    model:
      showThinkingLevel: true
    git:
      showBranch: true
      showStaged: false
      showUnstaged: false
      showUntracked: false
  compactThinkingLevel: true
dev:
  autoqa: false
  autoqaPush:
    endpoint: ""
hideThinkingBlock: true
irc:
  timeoutMs: 300000
steeringMode: all
interruptMode: wait
error:
  notify: "on"
github:
  enabled: true
textVerbosity: low
composer:
  shape: claude
tui:
  titleState: false
generate_image:
  enabled: true
isolation:
  backend: auto
retry:
  fallbackChains:
    default:
      - omniroute/kimi-k3-256k:high
    smol:
      - omniroute/deepseek-v4-flash:max
    commit:
      - omniroute/deepseek-v4-flash:high
    task:
      - omniroute/deepseek-v4-flash:max
    slow:
      - omniroute/kimi-k3-256k:max
