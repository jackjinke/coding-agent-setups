setupVersion: 2
modelRoles: 
  alpha: omniroute/combo/coding-alpha
  beta: omniroute/combo/coding-beta
  smol: "@beta:max"
  tiny: omniroute/combo/flash:high
  designer: omniroute/combo/designer:xhigh
  task: "@alpha:medium"
  plan: "@alpha"
  commit: "@smol"
  vision: omniroute/combo/vision
  advisor: "@slow"
  reviewer: "@slow"
  slow: omniroute/combo/reviewer
  default: "@alpha"
defaultThinkingLevel: high
personality: pragmatic
compaction: 
  idleEnabled: true
  methodOrder: 
    - shake
    - soft
browser: 
  headless: true
  relay: false
task: 
  showResolvedModelBadge: true
  isolation: 
    mode: auto
    merge: patch
    commits: generic
  agentModelOverrides: 
    {}
  agentPrewalk: 
    {}
commands: 
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
providers: 
  streamIdleTimeoutSeconds: -1
  streamFirstEventTimeoutSeconds: -1
  unexpectedStopModel: online
tools: 
  approvalMode: yolo
  outputMaxColumns: 0
disabledProviders: 
  - claude
  - codex
  - opencode
  - ollama
exa: 
  enabled: true
secrets: 
  enabled: true
display: 
  shimmer: classic
modelRoleStorage: global
collab: 
  relayUrl: ""
share: 
  serverUrl: ""
symbolPreset: nerd
statusLine: 
  preset: custom
  leftSegments: 
    - model
    - mode
    - context_pct
    - git
  rightSegments: 
    - session_name
  segmentOptions: 
    model: 
      showThinkingLevel: true
    git: 
      showBranch: true
      showStaged: false
      showUnstaged: false
      showUntracked: false
  transparent: false
  sessionAccent: true
  compactThinkingLevel: true
  separator: powerline-thin
memory: 
  backend: "off"
bashInterceptor: 
  enabled: false
snapcompact: 
  shape: auto
  systemPrompt: none
dev: 
  autoqa: false
  autoqaPush: 
    endpoint: ""
hideThinkingBlock: false
irc: 
  timeoutMs: 300000
prewalk: 
  enabled: false
treeFilterMode: default
steeringMode: all
interruptMode: wait
followUpMode: one-at-a-time
error: 
  notify: "on"
title: 
  refreshOnReplan: true
github: 
  enabled: true
security: 
  enabled: false
autoResume: false
textVerbosity: low
features: 
  unexpectedStopDetection: true
tui: 
  scrollbackRebuild: true
  imeSafeCursor: false
todo: 
  reminders: false
  enabled: true
ttsr: 
  builtinRules: true
composer: 
  shape: claude