setupVersion: 1
modelRoles: 
  alpha: omniroute/combo/coding-alpha
  beta: omniroute/combo/coding-beta
  smol: "@beta:xhigh"
  tiny: omniroute/combo/flash:high
  designer: omniroute/combo/designer:xhigh
  task: "@alpha:medium"
  plan: "@alpha"
  commit: "@smol"
  vision: omniroute/combo/vision
  advisor: "@slow"
  reviewer: "@slow"
  slow: omniroute/combo/reviewer
  default: "@alpha:high"
defaultThinkingLevel: high
personality: pragmatic
compaction: 
  strategy: snapcompact
browser: 
  headless: false
  relay: true
plan: 
  defaultOnStartup: false
task: 
  eager: default
  showResolvedModelBadge: true
  prewalk: false
  isolation: 
    mode: auto
    merge: patch
    commits: generic
  agentModelOverrides: 
    {}
  agentPrewalk: 
    {}
commands: 
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
providers: 
  streamIdleTimeoutSeconds: -1
  streamFirstEventTimeoutSeconds: -1
tools: 
  approvalMode: yolo
advisor: 
  enabled: false
disabledProviders: 
  - claude
  - codex
  - opencode
  - ollama
exa: 
  enabled: true
secrets: 
  enabled: true
display: 
  shimmer: classic
modelRoleStorage: global
collab: 
  relayUrl: ""
share: 
  serverUrl: ""
symbolPreset: nerd
statusLine: 
  preset: custom
  leftSegments: 
    - model
    - mode
    - context_pct
    - git
  segmentOptions: 
    model: 
      showThinkingLevel: true
    git: 
      showBranch: true
      showStaged: false
      showUnstaged: false
      showUntracked: false
  transparent: false
  sessionAccent: true
  compactThinkingLevel: true
  separator: powerline-thin
memory: 
  backend: "off"
bashInterceptor: 
  enabled: false
snapcompact: 
  shape: auto
  systemPrompt: none
dev: 
  autoqaConsent: granted
  autoqa: false
  autoqaPush: 
    endpoint: ""
hideThinkingBlock: true
irc: 
  timeoutMs: 300000
prewalk: 
  enabled: false
treeFilterMode: default
steeringMode: all
interruptMode: wait
followUpMode: one-at-a-time
error: 
  notify: "on"
title: 
  refreshOnReplan: false
github: 
  enabled: true
security: 
  enabled: false
autoResume: true