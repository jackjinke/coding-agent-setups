# All providers route through CLIProxyAPI. `apiKey` names the env var
# (set in ~/.omp/agent/.env). The key contains "sk-ant-oat" would make omp
# sends its native Claude Code request shape.
providers:
  anthropic:
    baseUrl: http://cpa.sorcery.link:8317
    apiKey: CLIPROXYAPI_API_KEY
    compat:
      supportsLongCacheRetention: true
      supportsEagerToolInputStreaming: true
      replayUnsignedThinking: false
    remoteCompaction:
      enabled: true

  openai:
    baseUrl: http://cpa.sorcery.link:8317/v1
    apiKey: CLIPROXYAPI_API_KEY
    api: openai-responses
    discovery:
      type: openai-models-list
    remoteCompaction:
      # Use Codex V2 headers while retaining CPA's shared /v1 Responses route.
      api: openai-codex-responses
      v2StreamingEnabled: true
      v2Endpoint: http://cpa.sorcery.link:8317/v1/responses

  cliproxyapi:
    baseUrl: http://cpa.sorcery.link:8317/v1
    apiKey: CLIPROXYAPI_API_KEY
    api: openai-completions
    discovery:
      type: openai-models-list

  google:
    baseUrl: http://cpa.sorcery.link:8317/v1beta
    apiKey: CLIPROXYAPI_API_KEY

  deepseek:
    baseUrl: http://cpa.sorcery.link:8317/v1
    apiKey: CLIPROXYAPI_API_KEY

  zai:
    baseUrl: http://cpa.sorcery.link:8317/v1
    apiKey: CLIPROXYAPI_API_KEY

  moonshot:
    baseUrl: http://cpa.sorcery.link:8317/v1
    apiKey: CLIPROXYAPI_API_KEY
